services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Secret used by the JWT Authentication plugin — CHANGE THIS in production.
      JWT_AUTH_SECRET_KEY: change-me-to-a-long-random-string
      # Public URL of the Next.js storefront (used for CORS + redirects)
      DUVETE_STOREFRONT_URL: http://localhost:3000
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/duvete-headless:/var/www/html/wp-content/themes/duvete-headless
      - ./scripts:/scripts

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
      - db
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/duvete-headless:/var/www/html/wp-content/themes/duvete-headless
      - ./scripts:/scripts
    user: "33:33" # www-data
    entrypoint: ["bash", "-c", "sleep infinity"]

volumes:
  db_data:
  wp_data:
